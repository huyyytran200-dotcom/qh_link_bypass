<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>QH Link Bypass</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px 16px;
  background:#0b1220;color:#f3f7ff;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
main{max-width:520px;margin:35px auto}
.brand{text-align:center;margin-bottom:35px}
.logo{
  width:80px;height:80px;border-radius:24px;
  display:grid;place-items:center;margin:auto;
  background:linear-gradient(135deg,#38bdf8,#2563eb);
  font-size:30px;font-weight:bold;
}
h1{font-size:30px;margin:20px 0 10px}
.subtitle{color:#9fb1ca;font-size:17px}
.panel{
  background:#142238;border:1px solid #2a405e;
  border-radius:24px;padding:24px;
}
label{display:block;font-weight:700;margin-bottom:12px}
input{
  width:100%;padding:17px 14px;border-radius:15px;
  border:1px solid #39516f;background:#091323;
  color:white;font-size:16px;outline:none;
}
button{
  width:100%;padding:18px;margin-top:20px;
  border:0;border-radius:15px;
  background:linear-gradient(100deg,#168cf0,#32b6f5);
  color:white;font-size:17px;font-weight:bold;
}
#status{color:#fca5a5;overflow-wrap:anywhere}
.note{text-align:center;color:#8fa4c0;line-height:1.7}
</style>
</head>
<body>
<main>
  <header class="brand">
    <div class="logo">QH</div>
    <h1>QH Link Bypass</h1>
    <p class="subtitle">Nhập liên kết để tiếp tục</p>
  </header>

  <section class="panel">
    <form id="linkForm">
      <label for="url">Liên kết cần xử lý</label>
      <input id="url" type="url"
        placeholder="https://example.com/..."
        autocomplete="url" required>
      <button type="submit">↗ Xử lý liên kết</button>
      <p id="status" role="status"></p>
    </form>
  </section>

  <p class="note">
    QH Link Bypass · Telegram Mini App
  </p>
</main>

<script>
const form = document.getElementById('linkForm');
const input = document.getElementById('url');
const status = document.getElementById('status');

form.addEventListener('submit', function(event) {
  event.preventDefault();

  let parsed;

  try {
    parsed = new URL(input.value.trim());
  } catch {
    status.textContent = 'Vui lòng nhập URL hợp lệ.';
    return;
  }

  if (!['http:', 'https:'].includes(parsed.protocol)) {
    status.textContent = 'Chỉ hỗ trợ liên kết HTTP hoặc HTTPS.';
    return;
  }

  window.location.href = parsed.href;
});
</script>
</body>
</html>
